# Fonts
font_family      Maple Mono NF
bold_font        Maple Mono NF Bold
italic_font      Maple Mono NF Italic
bold_italic_font Maple Mono NF Bold Italic
adjust_column_width 2
font_size 12.5

# Behavior
enable_audio_bell no
bell_on_tab ""
notify_on_cmd_finish never
command_on_bell none
filter_notification all
open_url_with default
cursor_blink_interval 0
cursor_shape beam
mouse_hide_wait 2.0
scrollback_lines 10000
copy_on_select clipboard

#background_opacity 0.77
#background_opacity 0.84
#background_opacity 0.98

#   - path hints: map alt+shift+p kitten hints --type path --program @
#   - startup session file (~/.config/kitty/launch.session)
#   - image rendering (just works with yazi/ranger if they support kitty protocol)

# Window
hide_window_decorations yes
window_padding_width 6 18 6 18
confirm_os_window_close 0

# Tab Bar
tab_bar_min_tabs 100
tab_bar_edge bottom
tab_bar_align center
tab_bar_style separator
tab_separator " | "
tab_title_template "{title} [{layout_name}]"

# Layouts — splits gives tmux-style splits; stack toggles single-pane focus.
enabled_layouts splits,stack

# Keymaps
map ctrl+backspace send_text all \x17
map ctrl+left send_text all \x1bb
map ctrl+right send_text all \x1bf
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map alt+shift+t launch --location=vsplit
map alt+shift+s launch --location=hsplit
map alt+shift+d close_window
map page_up scroll_page_up
map page_down scroll_page_down
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# BEGIN_KITTY_THEME
# Kanagawa — see ~/lab/dotfiles/kanagawa-palette.md
include current-theme.conf
include ~/.config/kanagawa/roles.conf
# END_KITTY_THEME
