# herdr — terminal workspace manager for AI coding agents
#
# Reload without restarting:  herdr server reload-config
# Never `herdr server stop` from inside a pane — it kills the panes too.

onboarding = false

[theme]
name = "kanagawa"

[ui.toast]
# Notifications go to mako on this machine.
delivery = "system"

[ui.sound]
enabled = false

[keys]
# Same split keys as tmux: \ for side-by-side, - for stacked, and % / " still work.
# New panes already open in the current pane's folder (terminal.new_cwd = "follow").
# Mouse capture and drag-to-copy are on by default, matching tmux's `mouse on`.
split_vertical   = ["prefix+backslash", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]
# Arrows focus panes too, alongside the default h/j/k/l.
focus_pane_left  = ["prefix+h", "prefix+left"]
focus_pane_down  = ["prefix+j", "prefix+down"]
focus_pane_up    = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]

# Move the focused pane by swapping it with its neighbour: prefix+shift+arrow.
# herdr has no built-in action for this, so each key calls the pane swap API.
[[keys.command]]
key = "prefix+shift+left"
type = "shell"
command = "herdr pane swap --current --direction left"

[[keys.command]]
key = "prefix+shift+down"
type = "shell"
command = "herdr pane swap --current --direction down"

[[keys.command]]
key = "prefix+shift+up"
type = "shell"
command = "herdr pane swap --current --direction up"

[[keys.command]]
key = "prefix+shift+right"
type = "shell"
command = "herdr pane swap --current --direction right"
