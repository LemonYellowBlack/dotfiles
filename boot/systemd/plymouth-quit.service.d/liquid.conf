# boot/install puts this in /etc/systemd/system/plymouth-quit.service.d/. The boot splash fades to
# black before it quits, so the greeter, which waits for it to be gone (greetd.service is after
# plymouth-quit-wait), comes in from black instead of cutting in over the console.
[Service]
ExecStartPre=-/usr/bin/plymouth update --status=liquid:fade
ExecStartPre=-/usr/bin/sleep 0.4
