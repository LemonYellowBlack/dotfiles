# Mouse: wheel scrolls history, click selects panes, drag selects text.
# Drag-select copies to the clipboard via OSC 52 (set-clipboard external);
# Shift+drag bypasses tmux for a plain kitty selection.
set -g mouse on

# The default MouseDragEnd1Pane is copy-pipe-and-cancel, which leaves copy mode
# the moment the button is released so the highlight vanishes and the copy
# looks like it failed. Keep the selection on screen; q or a click clears it.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear

# Splits on keys that don't need Shift: \ for side-by-side, - for stacked.
# New panes open in the current pane's directory. % and " still work.
bind '\' split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"

# Shift+Enter (Claude Code's newline). kitty has no modifyOtherKeys, so it
# sends a plain CR that tmux can't tell from Enter; kitty.conf instead sends
# CSI 13;2u while var:in_tmux is set, which the smcup/rmcup overrides below set
# on attach and clear on detach. tmux then forwards it to panes that ask for
# extended keys (Claude Code requests modifyOtherKeys mode 2).
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-kitty:extkeys'
set -as terminal-overrides 'xterm-kitty:smcup=\E[?1049h\E]1337;SetUserVar=in_tmux=MQ==\007:rmcup=\E]1337;SetUserVar=in_tmux\007\E[?1049l'
