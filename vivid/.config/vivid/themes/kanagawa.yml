  # theme:end

core: # See `dircolors -p` for explanations
  normal_text:
    foreground: fujiGray

  regular_file: {}

  reset_to_normal:
    foreground: fujiGray

  directory:
    foreground: crystalBlue
    font-style: bold

  executable_file:
    foreground: springGreen
    font-style: bold

  file_with_capability:
    background: sumiInk4

  setuid:
    background: sumiInk4

  setgid:
    background: sumiInk4

  sticky:
    background: sumiInk4

  sticky_other_writable:
    foreground: sumiInk3
    background: crystalBlue
    font-style: bold

  other_writable:
    foreground: crystalBlue
    background: sumiInk4
    font-style: bold

  symlink:
    foreground: springBlue
    font-style: italic

  broken_symlink:
    foreground: sumiInk3
    background: samuraiRed

  missing_symlink_target:
    foreground: samuraiRed

  multi_hard_link: {}

  socket:
    foreground: waveAqua1
    background: winterBlue
    font-style: bold

  fifo:
    foreground: surimiOrange
    background: winterYellow
    font-style: bold

  door:
    foreground: springGreen
    background: winterGreen
    font-style: bold

  block_device:
    foreground: waveRed
    background: winterRed
    font-style: bold

  character_device:
    foreground: carpYellow
    background: winterYellow
    font-style: bold

executable: # Libs and binaries without exec bit
  foreground: waveAqua1

archives:
  foreground: waveRed
  font-style: bold

media:
  audio:
    foreground: dragonBlue
    font-style: bold
  image:
    foreground: oniViolet
    font-style: bold
  video:
    foreground: waveAqua2
    font-style: bold
  fonts:
    foreground: waveAqua1
    font-style: bold
  3d:
    foreground: oniViolet
    font-style: bold

office:
  foreground: oniViolet2
  font-style: bold

text:
  foreground: fujiWhite
  configuration:
    foreground: surimiOrange
    dockerfile:
      foreground: waveAqua2
  licenses:
    foreground: fujiWhite
    font-style: bold
  special:
    foreground: springBlue
    font-style: bold
  todo:
    foreground: lightBlue
    font-style: bold

markup:
  foreground: fujiWhite

programming:
  foreground: carpYellow
  tooling:
    foreground: dragonBlue
    continuous-integration:
      foreground: waveAqua2

unimportant:
  foreground: sumiInk5
