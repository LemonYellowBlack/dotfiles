# Kanagawa (Wave) — see ~/lab/dotfiles/kanagawa-palette.md

format = """$hostname$directory$git_branch$git_status$python$cmd_duration$status$line_break$character"""

add_newline = true

# Colors by name, from the generated [palettes.theme] at the end.
palette = "theme"

[character]
success_symbol = "[❯](fg:carpYellow)"
error_symbol = "[❯](fg:peachRed)"

[status]
disabled = false
symbol = "✗ "
format = '[$symbol$status]($style) '
style = "fg:peachRed"

[directory]
style = "fg:crystalBlue"
truncation_length = 3
truncate_to_repo = true

[git_branch]
# symbol = " "
style = "fg:oniViolet"
#format = '[$symbol$branch]($style) '
format = '[$branch]($style) '

[git_status]
style = "fg:surimiOrange"
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2_000
style = "fg:textFaint"
format = "[$duration]($style) "

[python]
format = '[($virtualenv )]($style)'
style = "fg:crystalBlue"
python_binary = []

# Environment indicator: WSL distro name (csc/archlinux) when in WSL,
# remote hostname when SSH'd into a box. Neither shows on a plain local Linux box.
#[env_var.WSL_DISTRO_NAME]
#variable = "WSL_DISTRO_NAME"
#format = "[$env_value]($style) "
#style = "fg:waveAqua2"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "fg:waveAqua2"

