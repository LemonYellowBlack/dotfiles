# Kanagawa (Wave) — see ~/lab/dotfiles/kanagawa-palette.md

format = """${env_var.WSL_DISTRO_NAME}$hostname$directory$git_branch$git_status$python$cmd_duration$status$line_break$character"""

add_newline = true

[character]
success_symbol = "[❯](fg:#E6C384)"
error_symbol = "[❯](fg:#FF5D62)"

[status]
disabled = false
symbol = "✗ "
format = '[$symbol$status]($style) '
style = "fg:#FF5D62"

[directory]
style = "fg:#7E9CD8"
truncation_length = 3
truncate_to_repo = true

[git_branch]
# symbol = " "
style = "fg:#957FB8"
#format = '[$symbol$branch]($style) '
format = '[$branch]($style) '

[git_status]
style = "fg:#FFA066"
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2_000
style = "fg:#727169"
format = "[$duration]($style) "

[python]
format = '[($virtualenv )]($style)'
style = "fg:#7E9CD8"
python_binary = []

# Environment indicator: WSL distro name (csc/archlinux) when in WSL,
# remote hostname when SSH'd into a box. Neither shows on a plain local Linux box.
[env_var.WSL_DISTRO_NAME]
variable = "WSL_DISTRO_NAME"
format = "[$env_value]($style) "
style = "fg:#7AA89F"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "fg:#7AA89F"
