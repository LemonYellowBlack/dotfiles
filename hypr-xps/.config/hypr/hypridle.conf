general {
    # The shell's lock screen (quickshell/liquid/surfaces/Locker.qml); hyprlock if the shell isn't running.
    lock_cmd = pidof hyprlock || qs -c liquid ipc call lock lock || hyprlock
    before_sleep_cmd = ~/.local/bin/lock-if-enabled
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim backlight after 2.5 min
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock screen after 5 min (skipped when auto-lock is toggled off)
listener {
    timeout = 300
    on-timeout = ~/.local/bin/lock-if-enabled
}

# Screen off after 5.5 min
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 60 min
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
