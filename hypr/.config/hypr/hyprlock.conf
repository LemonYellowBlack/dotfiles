# Kanagawa (Wave) — see ~/lab/dotfiles/kanagawa-palette.md
#
# Colors come in the same layers as the Liquid shell's Theme.qml: palette names from
# kanagawa/palette.conf, the tokens below that give each one a job, and rgb()/rgba() where a
# token is used, which is also where opacity goes. Retheme by pointing a token at another name.

source = ~/.config/kanagawa/palette.conf

$background = $sumiInk3     # behind the wallpaper, until it loads
$veil       = $sumiInk3     # dims the wallpaper
$accent     = $crystalBlue  # the password field's ring (the shell's accent is carpYellow)
$field      = $sumiInk4     # inside the password field
$text       = $fujiWhite    # the clock and the typed dots
$textMuted  = $fujiGray     # the icon under the clock
$checking   = $autumnGreen  # the ring while the password is checked
$danger     = $samuraiRed   # the ring after a wrong password

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb($background)
    # setlockwp START
    path = /home/robbie/Pictures/Wallpapers/nebula-4.jpg
    # setlockwp END
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba($veil,0.6)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb($accent)
    inner_color = rgb($field)
    font_color = rgb($text)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    check_color = rgb($checking)
    fail_color = rgb($danger)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    rounding = 4
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb($text)
    font_size = 72
    font_family = monospace
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = 
    color = rgb($textMuted)
    font_size = 16
    font_family = monospace
    position = 0, 40
    halign = center
    valign = center
}
