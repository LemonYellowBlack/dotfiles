# Kanagawa (Wave) — see ~/lab/dotfiles/kanagawa-palette.md
#
# Colors are theme/theme.toml's palette names and tokens, by way of the generated
# kanagawa/theme.conf, so $accentCool here is the shell's Theme.accentCool. rgb($token) is opaque
# and rgba($token,0.6) sets an opacity. Retheme in theme.toml and run theme/retheme. The checking
# and failed rings use palette names: no token does their job yet.

source = ~/.config/kanagawa/theme.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb($surfaceRaised)
    # setlockwp START
    path = /home/robbie/Pictures/Wallpapers/nebula-4.jpg
    # setlockwp END
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba($surfaceRaised,0.6)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb($accentCool)
    inner_color = rgb($layer)
    font_color = rgb($text)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    check_color = rgb($autumnGreen)
    fail_color = rgb($samuraiRed)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    rounding = 4
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb($text)
    font_size = 72
    font_family = monospace
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = 
    color = rgb($textFaint)
    font_size = 16
    font_family = monospace
    position = 0, 40
    halign = center
    valign = center
}
