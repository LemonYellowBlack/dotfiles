# Kanagawa (Wave) — see ~/lab/dotfiles/kanagawa-palette.md

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(1F1F28ff)
    # setlockwp START
    path = /home/robbie/Pictures/Wallpapers/nebula-4.jpg
    # setlockwp END
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba(1F1F2899)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(7E9CD8ff)
    inner_color = rgba(2A2A37ff)
    font_color = rgba(DCD7BAff)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    check_color = rgba(76946Aff)
    fail_color = rgba(E82424ff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    rounding = 4
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(DCD7BAff)
    font_size = 72
    font_family = monospace
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = 
    color = rgba(727169ff)
    font_size = 16
    font_family = monospace
    position = 0, 40
    halign = center
    valign = center
}
