# Colors are this machine's theme slots and tokens (theme/), by way of the generated
# ~/.config/theme/theme.conf, so $accent here is the shell's Theme.accent. rgb($token) is
# opaque and rgba($token,0.6) sets an opacity.

source = ~/.config/theme/theme.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb($surfaceRaised)
    # setlockwp START
    path = /home/robbie/Pictures/Wallpapers/galaxy-3840.png
    # setlockwp END
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba($surfaceRaised,0.6)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb($accent)
    inner_color = rgb($layer)
    font_color = rgb($text)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    check_color = rgb($success)
    fail_color = rgb($danger)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    rounding = 4
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb($text)
    font_size = 72
    font_family = monospace
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = 
    color = rgb($textFaint)
    font_size = 16
    font_family = monospace
    position = 0, 40
    halign = center
    valign = center
}
