# hyprland.conf
# Kanagawa (Wave) — see ~/lab/dotfiles/kanagawa-palette.md
source = ~/.config/kanagawa/roles.hypr

monitor=,preferred,auto,2
monitor = Unknown-1, disabled

env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = XDG_SESSION_TYPE,wayland
env = WLR_NO_HARDWARE_CURSORS,1
env = AQ_NO_MODIFIERS,1
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = hyprpaper
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-clip-persist --clipboard regular
exec-once = gammastep
exec-once = udiskie --no-tray
exec-once = systemctl --user start hyprpolkitagent
exec-once = touch "$XDG_RUNTIME_DIR/hypr-nolock"  # auto-lock off by default each boot (toggle: SUPER SHIFT F9)
# exec-once = waybar

bind = SUPER, Return, exec, kitty
bind = SUPER, B, exec, zen-browser
bind = SUPER, Q, killactive,
bind = SUPER, V, togglefloating,
bind = SUPER, F, fullscreen,
bind = SUPER, D, exec, fuzzel
bind = SUPER, L, exec, loginctl lock-session
bindl = , switch:Lid Switch, exec, ~/.local/bin/lock-if-enabled
bind = SUPER, C, exec, cliphist list | fuzzel -d | cliphist decode | wl-copy
bind = SUPER, F12, exec, ~/.local/bin/caff-status
bind = SUPER SHIFT, F12, exec, ~/.local/bin/caff
bind = SUPER, F1, exec, ~/.local/bin/statuspopup
bind = SUPER SHIFT, F1, exec, ~/.local/bin/statuspopup --persist
bind = SUPER, F2, exec, ~/.local/bin/batterypopup
bind = SUPER SHIFT, F2, exec, ~/.local/bin/batterypopup --persist
bind = SUPER, F10, exec, ~/.local/bin/touchpad-status
bind = SUPER SHIFT, F10, exec, ~/.local/bin/touchpad-toggle
bind = SUPER, F11, exec, ~/.local/bin/gpu-status
bind = SUPER SHIFT, F11, exec, ~/.local/bin/gpu-toggle
bind = SUPER, F9, exec, ~/.local/bin/lock-status
bind = SUPER SHIFT, F9, exec, ~/.local/bin/lock-toggle
bind = CTRL SUPER SHIFT, Delete, exec, systemctl poweroff

# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshots
bind = , Print, exec, hyprshot -m output -o ~/Pictures/Screenshots
bind = SUPER, Print, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = SUPER SHIFT, Print, exec, hyprshot -m window -o ~/Pictures/Screenshots

# Resize mode
bind = SUPER, R, submap, resize
submap = resize
binde = , right, resizeactive, 30 0
binde = , left, resizeactive, -30 0
binde = , up, resizeactive, 0 -30
binde = , down, resizeactive, 0 30
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

# Move/resize floating windows with mouse
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Move focus
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Swap windows
bind = SUPER SHIFT, left, swapwindow, l
bind = SUPER SHIFT, right, swapwindow, r
bind = SUPER SHIFT, up, swapwindow, u
bind = SUPER SHIFT, down, swapwindow, d

# Switch workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Tor Browser: float at fixed size to prevent fingerprinting via screen resolution
windowrule = match:class Tor Browser, float on, size 1600 1000, center on, suppress_event fullscreen maximize

input {
    kb_layout = us
    kb_options = caps:escape
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
    }
}

gesture = 3, horizontal, workspace

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    col.active_border = $focus_accent
    col.inactive_border = $dim_accent
}

decoration {
    rounding = 0

    shadow {
        enabled = false
    	range = 1
	    render_power = 1
	    color = rgba(1F1F28ee)					# sumiInk0
	    color_inactive = rgba(1F1F28aa)
    }

    blur {
        enabled = false
	    size = 3
	    passes = 1
	    vibrancy = 0.2
    }
}

animations {
    bezier = smooth, 0.15, 0.5, 0.20, 1.0
    animation = windows, 1, 5, smooth, slide
    animation = windowsOut, 1, 5, smooth, popin 80%
    animation = fade, 1, 6, smooth
    animation = workspaces, 1, 6, smooth, slide
    animation = layers, 1, 4, smooth, fade
}

dwindle {
    force_split = 2
    preserve_split = true
}

layerrule = blur off, match:namespace waybar

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
