# palette.conf — Kanagawa Wave by its kanagawa.nvim names, for hyprlang configs (hyprlock). The
# same names and values are in the Liquid shell's Theme.qml and in palette.lua (Hyprland).
#
# Each color is R,G,B so a config can wrap it at any opacity: rgb($crystalBlue), or
# rgba($sumiInk3,0.6) for 60%. No spaces after the commas: hyprlock splits gradient values on
# spaces. Configs read colors through tokens of their own rather than straight from here.

