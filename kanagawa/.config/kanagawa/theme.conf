# theme.conf — theme/theme.toml's colors for hyprlang configs (hyprlock). Generated by
# theme/retheme: edit theme.toml and run that, not this file.
#
# Every palette name, token and role is a variable, the same names the shell's Theme.qml uses,
# as R,G,B (R,G,B,A for a translucent token). Wrap it where it's used: rgb($accent), or
# rgba($surfaceRaised,0.6) for 60%. No spaces after the commas: hyprlock splits gradient values
# on spaces.

