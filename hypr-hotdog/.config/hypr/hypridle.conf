general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = ~/.local/bin/lock-if-enabled
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock screen after 5 min (skipped when auto-lock is toggled off)
listener {
    timeout = 300
    on-timeout = ~/.local/bin/lock-if-enabled
}

# Deliberately omitted from the laptop config:
#
#   - screen off (dpms off) listener
#       The display is a TV. Cutting the HDMI signal makes it show "No signal"
#       and drop into standby; the screen should only go off when the TV does.
#
#   - backlight dim listener (brightnessctl)
#       No /sys/class/backlight device on a desktop monitor.
#
#   - suspend after 60 min
#       This machine is administered over SSH on the tailnet. Suspending on
#       idle drops the tailnet link and makes it unreachable remotely.
