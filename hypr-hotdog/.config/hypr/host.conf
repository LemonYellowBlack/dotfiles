# host.conf — hotdog (desktop)
# Sourced at the end of hypr/.config/hypr/hyprland.conf.
# Parsing is linear, so anything here wins over the shared base.
monitor = HDMI-A-1, 3840x2160@60, 0x0, 2

# Thicker window borders. At scale 2 on a 55" panel viewed from a distance,
# the shared 1px border is effectively invisible.
general {
    border_size = 3
}
