# host.conf — hotdog (desktop)
# Sourced at the end of hypr/.config/hypr/hyprland.conf.
# Parsing is linear, so anything here wins over the shared base.

# Single dedicated RTX 4070 Ti driving an external monitor at scale 1.
# Adjust the output name once known: hyprctl monitors
monitor = ,preferred,auto,1

# Deliberately absent on this machine (see hypr-xps/host.conf for the laptop set):
#   - brightness binds      no /sys/class/backlight on a desktop monitor;
#                           use ddcutil for DDC/CI if you want them
#   - lid switch            no lid
#   - battery popup         no battery
#   - touchpad binds/block  no touchpad
#   - PRIME gpu-toggle      the 4070 Ti is the only GPU; unbinding it kills
#                           the display
