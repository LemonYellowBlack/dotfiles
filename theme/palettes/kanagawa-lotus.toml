name   = "Kanagawa Lotus"
kind   = "light"
about  = "Kanagawa's light variant: rice paper, indigo ink and lotus pinks."
source = "https://github.com/rebelot/kanagawa.nvim"

# Its colors, by the names it gives them.
[colors]
lotusInk1       = "#545464"
lotusInk2       = "#43436C"
lotusGray       = "#DCD7BA"
lotusGray2      = "#716E61"
lotusGray3      = "#8A8980"
lotusWhite0     = "#D5CEA3"
lotusWhite1     = "#DCD5AC"
lotusWhite2     = "#E5DDB0"
lotusWhite3     = "#F2ECBC"
lotusWhite4     = "#E7DBA0"
lotusWhite5     = "#E4D794"
lotusViolet1    = "#A09CAC"
lotusViolet2    = "#766B90"
lotusViolet3    = "#C9CBD1"
lotusViolet4    = "#624C83"
lotusBlue1      = "#C7D7E0"
lotusBlue2      = "#B5CBD2"
lotusBlue3      = "#9FB5C9"
lotusBlue4      = "#4D699B"
lotusBlue5      = "#5D57A3"
lotusGreen      = "#6F894E"
lotusGreen2     = "#6E915F"
lotusGreen3     = "#B7D0AE"
lotusPink       = "#B35B79"
lotusOrange     = "#CC6D00"
lotusOrange2    = "#E98A00"
lotusYellow     = "#77713F"
lotusYellow2    = "#836F4A"
lotusYellow3    = "#DE9800"
lotusYellow4    = "#F9D791"
lotusRed        = "#C84053"
lotusRed2       = "#D7474B"
lotusRed3       = "#E82424"
lotusRed4       = "#D9A594"
lotusAqua       = "#597B75"
lotusAqua2      = "#5E857A"
lotusTeal1      = "#4E8CA2"
lotusTeal2      = "#6693BF"
lotusTeal3      = "#5A7785"
lotusCyan       = "#D7E3D8"

# Which color fills each shared slot (slots.toml). A hex value is a blend or step the palette
# itself lacks.
[slots]
bg_deep         = "#C8C197"             # lotusWhite0, deepened
bg0             = "lotusWhite0"
bg1             = "lotusWhite1"
bg2             = "lotusWhite2"
bg3             = "lotusWhite3"
bg4             = "lotusWhite4"
bg5             = "lotusWhite5"
bg6             = "lotusViolet1"

bg_blue         = "lotusBlue1"
bg_blue_bright  = "lotusBlue2"
bg_blue_dim     = "lotusCyan"
bg_green        = "lotusGreen3"
bg_green_bright = "#A1BD96"             # lotusGreen3, deepened toward lotusGreen2
bg_red          = "lotusRed4"
bg_red_bright   = "#D48780"             # lotusRed4, deepened toward lotusRed
bg_yellow       = "lotusYellow4"

fg              = "lotusInk1"
fg_dim          = "lotusInk2"
fg_faint        = "lotusGray2"                # darker than upstream's comments, to read on the shell's frame
gray            = "lotusGray3"

red             = "lotusRed"
red_bright      = "lotusRed2"
red_strong      = "lotusRed3"
red_deep        = "lotusRed"

orange          = "lotusOrange"
orange_strong   = "lotusOrange2"

yellow          = "lotusYellow"
yellow_deep     = "lotusYellow3"
yellow_muted    = "lotusYellow2"
yellow_dim      = "lotusYellow2"

green           = "lotusGreen"
green_deep      = "lotusGreen2"

aqua            = "lotusAqua"
aqua_deep       = "lotusAqua2"

blue            = "lotusBlue4"
blue_bright     = "lotusTeal2"
blue_light      = "lotusBlue3"
blue_muted      = "lotusTeal3"

violet          = "lotusViolet4"
violet_light    = "lotusBlue5"
violet_muted    = "lotusViolet2"
lavender        = "lotusTeal1"

pink            = "lotusPink"
