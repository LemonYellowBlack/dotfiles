name        = "Carp"
description = "Off-whites and yellows lead and crystal blue is the cool counterpart; violet stays in code and the terminal."

# Every value is a slot (slots.toml), another token, #RRGGBB, or one of those at an opacity:
# "fg_dim @ 0.7". Tokens are what the shell (Theme.qml) and every template read.

[ui]
# Surfaces, darkest first.
surfaceDeep   = "bg_deep"         # the shell's island, tooltips, scrims
surface       = "bg0"             # the shell's frame, drawers, bar
surfaceRaised = "bg3"             # window thumbnails and tags; the lock screen's background
layer         = "bg4"             # pills, cards, tiles, buttons; the password field
layerHover    = "bg5"
line          = "bg6"             # tracks and idle borders, unfocused windows' borders
selection     = "bg_blue_bright"  # text selection, avatars
selectionDeep = "bg_blue"         # window previews, the cover-art backdrop
shadow        = "bg_deep"         # under windows

# Text, brightest first.
text          = "fg"
textAlt       = "fg_dim"          # values, notification bodies
textSubtle    = "yellow_muted"    # subtitles, artists, unselected tabs
textMuted     = "fg_dim @ 0.7"    # captions, hints, section labels
textFaint     = "fg_faint"        # idle states, chart axes
textDisabled  = "bg6"
textOnAccent  = "bg0"             # text over accent fills and gradients
caret         = "highlight"       # the terminal's and editors' cursor

# Accents and states.
accent        = "yellow"          # focus, active, primary
accentSoft    = "fg_dim"          # the pale start of accent fills
accentAlt     = "yellow_deep"     # the deep end of accent fills
accentCool    = "blue"            # the cool counterpart: media, suspend, file names in diffs
secondary     = "blue"            # host and app names
info          = "blue_bright"     # weather, fans, streaming
highlight     = "yellow"          # search matches, cursor, drop targets, lit toggles
success       = "aqua"
warning       = "orange_strong"
hot           = "orange"          # heavy load, the sun
danger        = "red"
dangerDeep    = "red_bright"

[roles]
# The chrome roles kitty, waybar and Hyprland's fallback border share.
content       = "surfaceRaised"   # editor, terminal and notification bodies; the active tab
chrome        = "surface"         # tab and status bars, inactive tabs
focus_accent  = "accent"          # active borders, the focused window's frame
dim_accent    = "layer"           # inactive borders

[ansi]
# The terminal's 16 colors (kitty), plus the two kitty adds after them. Where a ui token does the
# same job they follow it, so changing danger or success in the shell's drawer recolors the
# terminal too; the rest name slots.
ansiBlack         = "content"
ansiRed           = "dangerDeep"
ansiGreen         = "success"
ansiYellow        = "yellow_muted"
ansiBlue          = "blue"
ansiMagenta       = "violet"
ansiCyan          = "aqua_deep"
ansiWhite         = "textAlt"
ansiBrightBlack   = "textFaint"
ansiBrightRed     = "danger"
ansiBrightGreen   = "success"
ansiBrightYellow  = "highlight"
ansiBrightBlue    = "info"
ansiBrightMagenta = "violet_muted"
ansiBrightCyan    = "aqua"
ansiBrightWhite   = "text"
ansi16            = "hot"
ansi17            = "red_bright"

[syntax]
# Code: nvim, bat, yazi's previews and delta all read these, so code looks the same everywhere.
# The roles TextMate themes lack (controlFlow, operators, preproc, builtins) follow the ones bat
# folds them into.
# Apart from ui, so moving the accent never recolors code.
comments       = "fg_faint"
strings        = "fg_dim"
numbers        = "pink"
constants      = "yellow_deep"    # built-in constants, ALL_CAPS names, booleans
identifiers    = "yellow"         # members, fields, attributes; user constants
interpolation  = "yellow_muted"   # string interpolation
keywords       = "green"          # keywords and statements: if, for, while
storage        = "violet"         # def, class, let, fn, types as keywords; JSON keys
controlFlow    = "keywords"       # return, raise, throw
operators      = "keywords"       # + == and, and/or/not as words
preproc        = "keywords"       # imports, includes, macros, decorators
builtins       = "identifiers"    # self, this and other built-in variables
types          = "aqua"           # classes and types
functions      = "blue"
parameters     = "violet_light"
specials       = "blue_bright"    # tags, library functions and constants, constructors
punctuation    = "lavender"
regexps        = "yellow"
invalid        = "red_bright"     # invalid code, escape characters
deprecated     = "gray"
errors         = "red_strong"     # error diagnostics
diagnosticInfo = "blue_muted"
diagnosticHint = "aqua_deep"
gitAdded       = "green_deep"     # sign column and diff markers
gitRemoved     = "red_deep"
gitChanged     = "yellow_deep"
diffAdd        = "bg_green"
diffAddEmph    = "bg_green_bright"
diffDelete     = "bg_red"
diffDeleteEmph = "bg_red_bright"
diffChange     = "bg_yellow"      # the changed words in a changed line
diffChangeLine = "bg_blue_dim"    # a changed line
