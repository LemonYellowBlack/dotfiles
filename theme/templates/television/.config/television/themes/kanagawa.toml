# general
background = '{{content}}'           # sumiInk3
border_fg = '{{line}}'            # sumiInk6
text_fg = '{{text}}'              # fujiWhite
dimmed_text_fg = '{{textFaint}}'       # fujiGray
# input
input_text_fg = '{{carpYellow}}'        # carpYellow
result_count_fg = '{{info}}'      # springBlue
# results
result_name_fg = '{{springViolet2}}'       # springViolet2
result_line_number_fg = '{{autumnYellow}}' # autumnYellow
result_value_fg = '{{textAlt}}'      # oldWhite
selection_fg = '{{text}}'         # fujiWhite
selection_bg = '{{selection}}'         # waveBlue2 (matches kitty selection_background)
match_fg = '{{surimiOrange}}'             # surimiOrange
# preview
preview_title_fg = '{{oniViolet}}'     # oniViolet
# modes
channel_mode_fg = '{{sumiInk3}}'
channel_mode_bg = '{{springGreen}}'      # springGreen
remote_control_mode_fg = '{{sumiInk3}}'
remote_control_mode_bg = '{{carpYellow}}' # carpYellow
action_picker_mode_fg = '{{sumiInk3}}'
