# vivid's theme, read by shell.zsh. Generated by theme/retheme for {{theme.host}} ({{theme.palette}}, {{theme.variation}}):
# edit theme/ and run retheme, not this file.

colors:
  # Every slot and token. A terminal color has no opacity, so a token's is dropped.
{% for c in slots %}
  {{c.name}}:{{col:18}}"{{c|bare}}"
{% endfor %}
{% for c in ui %}
  {{c.name}}:{{col:18}}"{{c|bare}}"
{% endfor %}

core: # See `dircolors -p` for explanations
  normal_text:
    foreground: fg_faint

  regular_file: {}

  reset_to_normal:
    foreground: fg_faint

  directory:
    foreground: blue
    font-style: bold

  executable_file:
    foreground: green
    font-style: bold

  file_with_capability:
    background: bg4

  setuid:
    background: bg4

  setgid:
    background: bg4

  sticky:
    background: bg4

  sticky_other_writable:
    foreground: bg3
    background: blue
    font-style: bold

  other_writable:
    foreground: blue
    background: bg4
    font-style: bold

  symlink:
    foreground: blue_bright
    font-style: italic

  broken_symlink:
    foreground: bg3
    background: red_strong

  missing_symlink_target:
    foreground: red_strong

  multi_hard_link: {}

  socket:
    foreground: aqua_deep
    background: bg_blue_dim
    font-style: bold

  fifo:
    foreground: orange
    background: bg_yellow
    font-style: bold

  door:
    foreground: green
    background: bg_green
    font-style: bold

  block_device:
    foreground: red
    background: bg_red
    font-style: bold

  character_device:
    foreground: yellow
    background: bg_yellow
    font-style: bold

executable: # Libs and binaries without exec bit
  foreground: aqua_deep

archives:
  foreground: red
  font-style: bold

media:
  audio:
    foreground: blue_muted
    font-style: bold
  image:
    foreground: violet
    font-style: bold
  video:
    foreground: aqua
    font-style: bold
  fonts:
    foreground: aqua_deep
    font-style: bold
  3d:
    foreground: violet
    font-style: bold

office:
  foreground: violet_light
  font-style: bold

text:
  foreground: fg
  configuration:
    foreground: orange
    dockerfile:
      foreground: aqua
  licenses:
    foreground: fg
    font-style: bold
  special:
    foreground: blue_bright
    font-style: bold
  todo:
    foreground: blue_light
    font-style: bold

markup:
  foreground: fg

programming:
  foreground: yellow
  tooling:
    foreground: blue_muted
    continuous-integration:
      foreground: aqua

unimportant:
  foreground: bg5
