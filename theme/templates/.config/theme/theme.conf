# theme.conf — this machine's colors for hyprlang configs (hyprlock). Generated by theme/retheme for
# {{theme.host}} ({{theme.palette}}, {{theme.variation}}): edit theme/ and run retheme, not this file.
#
# Every slot and token is a variable, the same names the shell's Theme.qml uses, as R,G,B
# (R,G,B,A for a translucent token). Wrap it where it's used: rgb($accent), or
# rgba($surfaceRaised,0.6) for 60%. No spaces after the commas: hyprlock splits gradient values
# on spaces.

# Slots: the palette's colors, by the names every palette shares.
{% for c in slots %}
${{c.name|pad:15}} = {{c|rgb|pad:12}} # {{c|ref}}
{% endfor %}

# Tokens: the job each color does.
{% for c in ui %}
${{c.name|pad:15}} = {{c|rgba4|pad:16}} # {{c|src}}
{% endfor %}

# Chrome roles, shared with kitty and waybar.
{% for c in roles %}
${{c.name|pad:15}} = {{c|rgba4|pad:16}} # {{c|src}}
{% endfor %}
