# yazi's flavor. Generated by theme/retheme for {{theme.host}} ({{theme.palette}}, {{theme.variation}}):
# edit theme/ and run retheme, not this file. After dangooddd/kanagawa.yazi (LICENSE).

[mgr]
marker_copied = { fg = "{{green}}", bg = "{{green}}" }
marker_cut = { fg = "{{red}}", bg = "{{red}}" }
marker_marked = { fg = "{{accentCool}}", bg = "{{accentCool}}" }
marker_selected = { fg = "{{orange}}", bg = "{{orange}}" }

cwd = { fg = "{{accent}}" }

find_keyword = { fg = "{{orange}}", bg = "{{bg3}}" }
find_position = {}

count_copied = { fg = "{{bg3}}", bg = "{{green}}" }
count_cut = { fg = "{{bg3}}", bg = "{{red}}" }
count_selected = { fg = "{{bg3}}", bg = "{{orange}}" }

border_symbol = "│"
border_style = { fg = "{{fg}}" }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { reversed = true }

[tabs]
active = { fg = "{{bg3}}", bg = "{{accent}}" }
inactive = { fg = "{{textSubtle}}", bg = "{{layer}}" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }


[mode]
normal_main = { fg = "{{bg3}}", bg = "{{accent}}" }
normal_alt = { fg = "{{accent}}", bg = "{{layer}}" }
select_main = { fg = "{{bg3}}", bg = "{{accentAlt}}" }
select_alt = { fg = "{{accentAlt}}", bg = "{{layer}}" }
unset_main = { fg = "{{bg3}}", bg = "{{accentCool}}" }
unset_alt = { fg = "{{accentCool}}", bg = "{{layer}}" }


[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "{{textAlt}}", bg = "{{chrome}}" }

progress_label = { fg = "{{accent}}", bold = true }
progress_normal = { fg = "{{bg4}}", bg = "{{bg3}}" }
progress_error = { fg = "{{bg4}}", bg = "{{bg3}}" }

perm_type = { fg = "{{green}}" }
perm_read = { fg = "{{yellow}}" }
perm_write = { fg = "{{red_bright}}" }
perm_exec = { fg = "{{aqua}}" }
perm_sep = { fg = "{{textFaint}}" }


[pick]
border = { fg = "{{accent}}" }
active = { fg = "{{accentAlt}}", bold = true }
inactive = {}

[input]
border = { fg = "{{accent}}" }
title = {}
value = {}
selected = { reversed = true }

[completion]
border = { fg = "{{accent}}" }
active = { reversed = true }
inactive = {}

[tasks]
border = { fg = "{{accent}}" }
title = {}
hovered = { fg = "{{accentAlt}}" }

[which]
cols = 2
separator = " - "
separator_style = { fg = "{{textFaint}}" }
mask = { bg = "{{bg0}}" }
rest = { fg = "{{textFaint}}" }
cand = { fg = "{{accent}}" }
desc = { fg = "{{textDisabled}}" }

[help]
on = { fg = "{{secondary}}" }
run = { fg = "{{accentAlt}}" }
desc = {}
hovered = { reversed = true, bold = true }
footer = { fg = "{{bg3}}", bg = "{{fg}}" }

[notify]
title_info = { fg = "{{success}}" }
title_warn = { fg = "{{warning}}" }
title_error = { fg = "{{danger}}" }

[filetype]
rules = [
    # images
    { mime = "image/*", fg = "{{yellow}}" },

    # media
    { mime = "{audio,video}/*", fg = "{{violet}}" },

    # archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{red}}" },

    # documents
    { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "{{aqua_deep}}" },

    # broken links
    { url = "*", is = "orphan", fg = "{{red_deep}}" },

    # executables
    { url = "*", is = "exec", fg = "{{green_deep}}" },

    # fallback
    { url = "*", fg = "{{text}}" },
    { url = "*/", fg = "{{blue}}" },
]
