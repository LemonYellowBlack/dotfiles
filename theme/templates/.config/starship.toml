# Starship's prompt. Generated by theme/retheme for {{theme.host}} ({{theme.palette}}, {{theme.variation}}):
# edit theme/templates/.config/starship.toml and run retheme. The whole config lives there,
# since starship can't include another file.

format = """$hostname$directory$git_branch$git_status$python$cmd_duration$status$line_break$character"""

add_newline = true

# Colors by name, from the generated [palettes.theme] at the end.
palette = "theme"

[character]
success_symbol = "[❯](fg:accent)"
error_symbol = "[❯](fg:danger)"

[status]
disabled = false
symbol = "✗ "
format = '[$symbol$status]($style) '
style = "fg:danger"

[directory]
style = "fg:accentSoft"
truncation_length = 3
truncate_to_repo = true

[git_branch]
# symbol = " "
style = "fg:accentAlt"
#format = '[$symbol$branch]($style) '
format = '[$branch]($style) '

[git_status]
style = "fg:hot"
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
min_time = 2_000
style = "fg:textFaint"
format = "[$duration]($style) "

[python]
format = '[($virtualenv )]($style)'
style = "fg:accentCool"
python_binary = []

# Environment indicator: WSL distro name (csc/archlinux) when in WSL,
# remote hostname when SSH'd into a box. Neither shows on a plain local Linux box.
#[env_var.WSL_DISTRO_NAME]
#variable = "WSL_DISTRO_NAME"
#format = "[$env_value]($style) "
#style = "fg:secondary"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "fg:secondary"

# starship lowercases style names before looking them up, so the keys here are lowercase.
[palettes.theme]
{% for c in slots %}
{{c.name|lower}} = "{{c}}"
{% endfor %}
{% for c in ui %}
{{c.name|lower}} = "{{c}}"
{% endfor %}
