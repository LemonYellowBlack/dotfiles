# Satty — screenshot annotation. Generated by theme/retheme for {{theme.host}} ({{theme.palette}}, {{theme.variation}}):
# edit theme/templates/.config/satty/config.toml and run retheme. The whole config lives there,
# since satty can't include another file.
# Full reference: https://github.com/gabm/Satty/blob/main/config.toml

[general]
# Annotated copies land beside the hyprshot originals (see hypr/hyprland.lua).
# Supports a leading ~ (>= 0.20.0) and chrono strftime specifiers.
output-filename = "~/Pictures/Screenshots/%Y-%m-%d-%H%M%S_satty.png"

# Make the toolbar "copy" button and Ctrl+C actually reach the Wayland clipboard.
copy-command = "wl-copy"

# Enter = write the annotated copy, put it on the clipboard, then quit.
# Escape = quit without saving anything. Ctrl+S still saves on demand.
actions-on-enter = ["save-to-file", "save-to-clipboard", "exit"]
actions-on-escape = ["exit"]

initial-tool = "rectangle"
primary-highlighter = "block"
default-round-caps = true
corner-roundness = 12
disable-notifications = false

# Tool hotkeys (since 0.20.0) — these are the defaults, kept here as a cheat sheet.
[keybinds]
pointer = "p"
crop = "c"
brush = "b"
line = "i"
arrow = "z"
rectangle = "r"
ellipse = "e"
text = "t"
marker = "m"
blur = "u"
highlight = "g"

[font]
family = "Maple Mono NF"
style = "Bold"

# The palette's accents in the toolbar for quick selection, warm -> cool.
[color-palette]
palette = [
  "{{red_deep}}ff", # {{red_deep|ref}}
  "{{orange}}ff", # {{orange|ref}}
  "{{yellow}}ff", # {{yellow|ref}}
  "{{green}}ff", # {{green|ref}}
  "{{blue}}ff", # {{blue|ref}}
  "{{violet}}ff", # {{violet|ref}}
  "{{pink}}ff", # {{pink|ref}}
  "{{fg}}ff", # {{fg|ref}}
]
custom = [
  "{{bg3}}", # {{bg3|ref}}
  "{{bg0}}", # {{bg0|ref}}
]
