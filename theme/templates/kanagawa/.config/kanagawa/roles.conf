# Kanagawa chrome roles — kitty format. Generated by theme/retheme from [roles] in
# theme/theme.toml: edit that and run retheme, not this file.
#
# kitty doesn't support variables, so this file directly assigns the chrome
# keys. Included from kitty.conf via `include ~/.config/kanagawa/roles.conf`.

# focus accent ({{focus_accent|ref}})
active_border_color     {{focus_accent}}

# dim accent ({{dim_accent|ref}})
inactive_border_color   {{dim_accent}}

# chrome ({{chrome|ref}})
tab_bar_background      {{chrome}}
inactive_tab_background {{chrome}}

# content ({{content|ref}})
active_tab_background   {{content}}
