# Kanagawa (Wave) — see ~/lab/dotfiles/kanagawa-palette.md
# Upstream: https://github.com/rebelot/kanagawa.nvim
# Generated by theme/retheme from theme/theme.toml: edit that and run retheme, not this file.

[mgr]
marker_copied = { fg = "{{springGreen}}", bg = "{{springGreen}}" }
marker_cut = { fg = "{{waveRed}}", bg = "{{waveRed}}" }
marker_marked = { fg = "{{accentCool}}", bg = "{{accentCool}}" }
marker_selected = { fg = "{{surimiOrange}}", bg = "{{surimiOrange}}" }

cwd = { fg = "{{accent}}" }

find_keyword = { fg = "{{surimiOrange}}", bg = "{{sumiInk3}}" }
find_position = {}

count_copied = { fg = "{{sumiInk3}}", bg = "{{springGreen}}" }
count_cut = { fg = "{{sumiInk3}}", bg = "{{waveRed}}" }
count_selected = { fg = "{{sumiInk3}}", bg = "{{surimiOrange}}" }

border_symbol = "│"
border_style = { fg = "{{fujiWhite}}" }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { reversed = true }

[tabs]
active = { fg = "{{sumiInk3}}", bg = "{{accent}}" }
inactive = { fg = "{{textSubtle}}", bg = "{{layer}}" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }


[mode]
normal_main = { fg = "{{sumiInk3}}", bg = "{{accent}}" }
normal_alt = { fg = "{{accent}}", bg = "{{layer}}" }
select_main = { fg = "{{sumiInk3}}", bg = "{{accentAlt}}" }
select_alt = { fg = "{{accentAlt}}", bg = "{{layer}}" }
unset_main = { fg = "{{sumiInk3}}", bg = "{{accentCool}}" }
unset_alt = { fg = "{{accentCool}}", bg = "{{layer}}" }


[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "{{textAlt}}", bg = "{{chrome}}" }

progress_label = { fg = "{{accent}}", bold = true }
progress_normal = { fg = "{{sumiInk4}}", bg = "{{sumiInk3}}" }
progress_error = { fg = "{{sumiInk4}}", bg = "{{sumiInk3}}" }

perm_type = { fg = "{{springGreen}}" }
perm_read = { fg = "{{carpYellow}}" }
perm_write = { fg = "{{peachRed}}" }
perm_exec = { fg = "{{waveAqua2}}" }
perm_sep = { fg = "{{textFaint}}" }


[pick]
border = { fg = "{{accent}}" }
active = { fg = "{{accentAlt}}", bold = true }
inactive = {}

[input]
border = { fg = "{{accent}}" }
title = {}
value = {}
selected = { reversed = true }

[completion]
border = { fg = "{{accent}}" }
active = { reversed = true }
inactive = {}

[tasks]
border = { fg = "{{accent}}" }
title = {}
hovered = { fg = "{{accentAlt}}" }

[which]
cols = 2
separator = " - "
separator_style = { fg = "{{textFaint}}" }
mask = { bg = "{{sumiInk0}}" }
rest = { fg = "{{textFaint}}" }
cand = { fg = "{{accent}}" }
desc = { fg = "{{textDisabled}}" }

[help]
on = { fg = "{{secondary}}" }
run = { fg = "{{accentAlt}}" }
desc = {}
hovered = { reversed = true, bold = true }
footer = { fg = "{{sumiInk3}}", bg = "{{fujiWhite}}" }

[notify]
title_info = { fg = "{{success}}" }
title_warn = { fg = "{{warning}}" }
title_error = { fg = "{{danger}}" }

[filetype]
rules = [
    # images
    { mime = "image/*", fg = "{{carpYellow}}" },

    # media
    { mime = "{audio,video}/*", fg = "{{oniViolet}}" },

    # archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{waveRed}}" },

    # documents
    { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "{{waveAqua1}}" },

    # broken links
    { url = "*", is = "orphan", fg = "{{autumnRed}}" },

    # executables
    { url = "*", is = "exec", fg = "{{autumnGreen}}" },

    # fallback
    { url = "*", fg = "{{text}}" },
    { url = "*/", fg = "{{crystalBlue}}" },
]
