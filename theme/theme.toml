# theme.toml — every color in these dotfiles, in layers like the Liquid shell's Theme.qml:
#
#   [palette]  Kanagawa Wave by its kanagawa.nvim names. Fixed: these names are what everything
#              else uses, so no config needs a hex code.
#   [extras]   colors the shell needs that Kanagawa doesn't have.
#   [ui]       tokens: the job a color does (surface, text, accent, ...), as a palette name, or as
#              "name @ opacity" for a translucent one ("oldWhite @ 0.7").
#   [roles]    the chrome roles kitty, waybar and Hyprland's fallback look share, as ui tokens.
#
# A token can point at another token instead of a palette name. Edit this file, then run
# theme/retheme: it rewrites every file and block generated from it, listed in theme/templates/.

[palette]
sumiInk0      = "#16161D"
sumiInk1      = "#181820"
sumiInk2      = "#1A1A22"
sumiInk3      = "#1F1F28"
sumiInk4      = "#2A2A37"
sumiInk5      = "#363646"
sumiInk6      = "#54546D"
waveBlue1     = "#223249"
waveBlue2     = "#2D4F67"
winterGreen   = "#2B3328"
winterYellow  = "#49443C"
winterRed     = "#43242B"
winterBlue    = "#252535"
autumnGreen   = "#76946A"
autumnRed     = "#C34043"
autumnYellow  = "#DCA561"
samuraiRed    = "#E82424"
roninYellow   = "#FF9E3B"
waveAqua1     = "#6A9589"
waveAqua2     = "#7AA89F"
dragonBlue    = "#658594"
fujiWhite     = "#DCD7BA"
oldWhite      = "#C8C093"
fujiGray      = "#727169"
katanaGray    = "#717C7C"
oniViolet     = "#957FB8"
oniViolet2    = "#B8B4D0"
crystalBlue   = "#7E9CD8"
springViolet1 = "#938AA9"
springViolet2 = "#9CABCA"
springBlue    = "#7FB4CA"
lightBlue     = "#A3D4D5"
springGreen   = "#98BB6C"
boatYellow1   = "#938056"
boatYellow2   = "#C0A36E"
carpYellow    = "#E6C384"
sakuraPink    = "#D27E99"
waveRed       = "#E46876"
peachRed      = "#FF5D62"
surimiOrange  = "#FFA066"

[extras]
abyss = "#0D0D12"  # a deeper ink than sumiInk0

[ui]
# Surfaces, darkest first.
surfaceDeep   = "abyss"           # the shell's island, tooltips, scrims
surface       = "sumiInk0"        # the shell's frame, drawers, bar
surfaceRaised = "sumiInk3"        # window thumbnails and tags; the lock screen's background
layer         = "sumiInk4"        # pills, cards, tiles, buttons; the password field
layerHover    = "sumiInk5"
line          = "sumiInk6"        # tracks and idle borders, unfocused windows' borders
selection     = "waveBlue2"       # text selection, avatars
selectionDeep = "waveBlue1"       # window previews, the cover-art backdrop
shadow        = "abyss"           # under windows

# Text, brightest first.
text          = "fujiWhite"
textAlt       = "oldWhite"        # values, notification bodies
textSubtle    = "boatYellow2"     # subtitles, artists, unselected tabs
textMuted     = "oldWhite @ 0.7"  # captions, hints, section labels
textFaint     = "fujiGray"        # idle states, chart axes
textDisabled  = "sumiInk6"
textOnAccent  = "sumiInk0"        # text over accent fills and gradients

# Accents and states.
accent        = "carpYellow"      # focus, active, primary
accentSoft    = "oldWhite"        # the pale start of accent fills
accentAlt     = "autumnYellow"    # the deep end of accent fills
accentCool    = "crystalBlue"     # the cool counterpart: media, suspend, the lock screen's ring
secondary     = "crystalBlue"     # host and app names
info          = "springBlue"      # weather, fans, streaming
highlight     = "carpYellow"      # search matches, cursor, drop targets, lit toggles
success       = "springGreen"
warning       = "roninYellow"
hot           = "surimiOrange"    # heavy load, the sun
danger        = "waveRed"
dangerDeep    = "autumnRed"

[roles]
content       = "surfaceRaised"   # editor, terminal and notification bodies; the active tab
chrome        = "surface"         # tab and status bars, inactive tabs
focus_accent  = "selection"       # active borders, the focused window's frame
dim_accent    = "layer"           # inactive borders
